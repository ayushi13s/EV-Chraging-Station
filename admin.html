<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Station - Admin</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        .auth-section, .dashboard-section {
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .danger-btn {
            background-color: #e74c3c;
        }
        .danger-btn:hover {
            background-color: #c0392b;
        }
        .success-message {
            color: green;
        }
        .error-message {
            color: red;
        }
        .bunk-item {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            background: #f9f9f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bunk-details {
            flex-grow: 1;
        }
        .bunk-actions button {
            padding: 5px 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>EV Charging Bunk Admin Panel</h1>
        </header>

        <section id="admin-auth" class="auth-section">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label for="admin-email">Email:</label>
                <input type="email" id="admin-email" placeholder="Enter your admin email">
            </div>
            <div class="form-group">
                <label for="admin-password">Password:</label>
                <input type="password" id="admin-password" placeholder="Enter your password">
            </div>
            <button id="admin-login-btn">Login</button>
            <p id="admin-auth-status"></p>
        </section>

        <section id="admin-dashboard" class="dashboard-section" style="display: none;">
            <p id="admin-user-info"></p>
            <button id="admin-logout-btn">Logout</button>
            
            <hr style="margin: 20px 0;">

            <h2>Add New Bunk Location</h2>
            <div class="form-group">
                <label for="bunk-name">Bunk Name:</label>
                <input type="text" id="bunk-name" placeholder="e.g., Jaipur EV Point">
            </div>
            <div class="form-group">
                <label for="bunk-address">Address:</label>
                <input type="text" id="bunk-address" placeholder="e.g., Malviya Nagar, Jaipur">
            </div>
            <div class="form-group">
                <label for="bunk-slots">Total Slots:</label>
                <input type="number" id="bunk-slots" placeholder="e.g., 10">
            </div>
            <div class="form-group">
                <label for="bunk-mobile">Mobile Number:</label>
                <input type="text" id="bunk-mobile" placeholder="e.g., 9876543210">
            </div>
            <button id="save-bunk-btn">Save Bunk</button>
            <p id="add-bunk-status"></p>

            <hr style="margin: 20px 0;">

            <h2>Manage Bunk Slots</h2>
            <div class="form-group">
                <label for="bunk-select">Select Bunk:</label>
                <select id="bunk-select">
                    <option value="">-- Select a Bunk --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="new-slots">New Total Slots:</label>
                <input type="number" id="new-slots" placeholder="Enter new slot count">
            </div>
            <button id="update-slots-btn">Update Slots</button>
            <p id="slot-update-status"></p>

            <hr style="margin: 20px 0;">

            <h2>Manage Bunk Details</h2>
            <div id="all-bunks-list">
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
